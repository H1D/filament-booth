<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:," />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Filament Booth, agent Python with stand-ins</title>
    <style>
      body { margin: 0; font: 14px system-ui, sans-serif; background: #16181b; color: #e8e6e1; }
      main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; padding: 16px; }
      textarea, pre { box-sizing: border-box; width: 100%; font: 12px ui-monospace, Menlo, monospace; background: #0e0f11; color: inherit; border: 1px solid #333; border-radius: 6px; padding: 8px; }
      textarea { height: 420px; resize: vertical; }
      pre { min-height: 200px; max-height: 420px; overflow: auto; white-space: pre-wrap; margin: 0; }
      .bar { display: flex; gap: 8px; align-items: center; margin: 8px 0; flex-wrap: wrap; }
      button { font: inherit; padding: 6px 14px; }
      .status { color: #a9b1ba; }
      .images { display: flex; gap: 8px; flex-wrap: wrap; }
      .images figure { margin: 0; }
      .images img { max-height: 160px; border: 1px solid #333; }
      .images figcaption { font-size: 11px; color: #a9b1ba; max-width: 220px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/dev/agent.tsx"></script>
  </body>
</html>
